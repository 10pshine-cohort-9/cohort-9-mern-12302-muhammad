# SonarQube / SonarCloud project configuration for the Notes App monorepo.
# Run a scan with: npx sonar-scanner -Dsonar.host.url=<your-server-url> -Dsonar.token=<your-token>

sonar.projectKey=notes-app
sonar.projectName=Notes App
sonar.projectVersion=1.0.0

# Both the backend (Node/Express) and frontend (React) source live under one
# repo root, so we scan them together and separate results with modules.
sonar.sources=backend/src,backend/server.js,frontend/src
sonar.tests=backend/test,frontend/src

sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/uploads/**,**/*.test.js,**/*.test.jsx,**/__tests__/**,**/__mocks__/**,**/scratch/**
sonar.test.inclusions=backend/test/**/*.test.js,frontend/src/**/*.test.js,frontend/src/**/*.test.jsx,frontend/src/**/__tests__/**

sonar.sourceEncoding=UTF-8

# Test coverage reports (generate these first with `npm run test:coverage`
# in each of backend/ and frontend/).
sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info,frontend/coverage/lcov.info

# Node's own test runner isn't used here; both backend (Mocha) and frontend
# (Jest) produce coverage independently, so no separate exec report is set.
